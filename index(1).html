<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rondas — Control de Asistencia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#10182b;--green:#079b72;--bg:#f3f5f7;--border:#dfe4ec;--text:#142033;--muted:#738198}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select{font:inherit}button{cursor:pointer}.topbar{height:55px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;gap:18px}.brand{display:flex;gap:10px;align-items:center}.logo{width:29px;height:29px;border-radius:7px;background:var(--green);display:grid;place-items:center;font-weight:800}.brand small{display:block;color:#9ba6bb;font-size:10px}.grow{flex:1}.pill{border:1px solid #354057;border-radius:18px;padding:7px 12px;font-size:11px;font-weight:700}.primary,.load{border:0;border-radius:6px;background:var(--green);color:#fff;padding:9px 13px;font-weight:700}.load{background:var(--navy)}
.layout{max-width:1450px;margin:auto;padding:22px 25px;display:grid;grid-template-columns:277px minmax(0,1fr);gap:22px}.topcards{grid-column:1/-1;display:flex;gap:10px;margin-top:-13px}.card{border:1px solid var(--border);background:#fff;border-radius:13px}.turn{width:253px;height:80px;background:var(--navy);color:#fff;padding:20px 16px}.turn div{font-size:11px;color:#c8d0df;margin-top:4px}.next{width:253px;height:80px;padding:12px 15px}.next select{display:block;border:0;background:#fff;margin-top:6px}.sidebar,.main{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.sidehead{padding:15px;border-bottom:1px solid var(--border);font-weight:700}.round{display:flex;gap:13px;align-items:center;padding:13px;border-bottom:1px solid var(--border);cursor:pointer}.round.sel{background:#f2f2f3}.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f0f3f7}.sel .num{background:var(--navy);color:#fff}.status{font-size:9px;border:1px solid #f3c36d;color:#df8a17;background:#fff9ed;border-radius:12px;padding:3px 7px}.status.done{border-color:#71d9bf;color:#00956d;background:#effcf8}.notify{margin:12px;width:calc(100% - 24px);height:35px;background:#fff;border:1px solid var(--navy);border-radius:6px;font-weight:700}.mainhead{padding:14px 18px;display:flex;align-items:center;gap:12px}.mainhead h2{margin:0;font-size:16px}.sub{color:#7b899d;font-size:10px;margin-top:3px}.stats{margin-left:auto;display:flex;gap:8px;align-items:center}.badge{padding:5px 10px;border-radius:14px;font-size:10px;font-weight:700}.ag{color:#008e69;background:#effcf8}.ar{color:#e54b57;background:#fff0f1}.date-control{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:6px;padding:4px 7px;margin-left:auto}.date-control input{border:0;outline:0;font-size:11px}.filters{padding:0 18px 12px;display:flex;gap:8px;align-items:center}.filters select{height:34px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 10px}.tablewrap{overflow:auto}.table{min-width:920px}.thead,.row{display:grid;grid-template-columns:178px 170px 170px minmax(220px,1fr) 115px;align-items:center}.thead{padding:11px 18px;background:#fafbfc;color:#7d8aa0;font-size:10px;font-weight:800}.row{min-height:76px;padding:10px 18px;border-top:1px solid #edf0f4}.employee{display:flex;gap:10px;align-items:center;font-weight:650}.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10px}.employee small{display:block;color:#8a96a8;font-size:10px}.toggle{display:flex;border:1px solid #dbe2ea;border-radius:6px;overflow:hidden;width:max-content}.toggle button{height:28px;padding:0 11px;border:0;background:#fff;color:#66758a;font-size:10px;font-weight:700}.toggle .on{background:var(--green);color:#fff}.toggle .off{background:#e34b55;color:#fff}.field{height:34px;border:1px solid #d9dee7;border-radius:6px;padding:0 10px;width:155px;background:#fff}.obs{width:100%}.history{display:flex;gap:4px;flex-wrap:wrap}.history span{border:1px solid #dce3ec;border-radius:4px;padding:4px;font-size:9px;color:#8a97a8}.history .cur{border-color:#79d7c0;color:#008e69;background:#eefbf7}
.modal-bg{display:none;position:fixed;inset:0;background:#10182b99;align-items:center;justify-content:center;padding:15px;z-index:5}.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:12px;padding:20px;position:relative}.close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:24px;color:#66758a}.att-sub{color:#7b899d;font-size:12px;margin:-8px 0 14px}.att-add{display:flex;gap:8px;padding-bottom:12px;border-bottom:1px solid #edf0f4}.att-add input{height:38px;flex:1;border:1px solid #d9dee7;border-radius:6px;padding:0 10px}.att-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:9px;border:1px solid #bde8dc;background:#f3fcf9;border-radius:7px;margin:7px 0}.att-role{display:block;font-size:10px;color:#8a97a8}.att-row input{width:17px;height:17px;accent-color:#111827}.trash{border:0;background:transparent;color:#b9c3cf}.remove-att{border:1px solid #f0c5c9;background:#fff0f1;color:#d94b57;border-radius:5px;padding:5px 7px;font-size:9px;font-weight:700}.controller{display:flex;gap:8px;align-items:center;margin-top:10px}.controller input{height:35px;flex:1;border:1px solid var(--border);border-radius:6px;padding:0 10px}.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f4;margin-top:12px;padding-top:12px;color:#8a97a8;font-size:11px}
.login{min-height:100vh;display:grid;place-items:center;background:var(--bg)}.loginbox{width:min(390px,calc(100% - 30px));background:#fff;border:1px solid var(--border);border-radius:14px;padding:25px;box-shadow:0 10px 35px #0000000b}.loginbox h1{margin:0 0 4px}.loginbox p{color:var(--muted);font-size:12px}.loginbox label{font-size:11px;font-weight:700;color:#66758a;display:block;margin-top:12px}.loginbox input{width:100%;height:40px;border:1px solid var(--border);border-radius:6px;padding:0 10px;margin-top:5px}.loginbox button{width:100%;margin-top:15px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:20}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:14px}.topcards{grid-column:auto;flex-wrap:wrap}.sidebar{order:2}.mainhead{flex-wrap:wrap}.stats{margin-left:0}.date-control{margin-left:0}}
@media(max-width:600px){.topbar{padding:0 10px}.topbar .pill{display:none}.layout{padding:10px}.turn,.next{width:100%}.topcards{flex-direction:column}}
</style>
</head>
<body>
<section id="loginView" class="login">
 <div class="loginbox">
  <div class="logo">R</div><h1>Rondas</h1><p>Control de asistencia</p>
  <label>Nombre del controlador<input id="regName" placeholder="Ej. Juan Pérez"></label>
  <label>Correo<input id="email" type="email" placeholder="correo@empresa.com"></label>
  <label>Contraseña<input id="password" type="password" placeholder="Mínimo 6 caracteres"></label>
  <button class="primary" onclick="login()">Ingresar / crear usuario</button>
  <p id="loginMsg"></p>
 </div>
</section>

<section id="appView" class="hidden">
<header class="topbar"><div class="brand"><div class="logo">R</div><div><b>Rondas</b><small>Control de Asistencia</small></div></div><div class="grow"></div><div class="pill" id="userBadge"></div><button class="primary" onclick="logout()">Salir</button></header>
<main class="layout">
 <section class="topcards">
  <div class="turn card"><b id="shiftName"></b><div id="shiftTimes"></div></div>
  <div class="next card"><b>Turno</b><select id="shiftTop" onchange="changeShift(this.value)"></select><small id="nextInfo"></small></div>
 </section>
 <aside class="sidebar"><div class="sidehead">Rondas Programadas</div><div id="rounds"></div><button class="notify" onclick="notify()">♧ Disparar Notificación</button></aside>
 <section class="main">
  <div class="mainhead"><div><h2 id="title"></h2><div class="sub">Asistencia, tareas y observaciones de la ronda.</div></div><div class="date-control">📅 <input id="date" type="date" onchange="changeDate(this.value)"></div><div class="stats"><span class="badge ag">Activos <b id="act">0</b></span><span class="badge ar">Inactivos <b id="ina">0</b></span><button class="load" onclick="openAttendance()">♧ Cargar Asistencia</button></div></div>
  <div class="filters"><b>Turno:</b><select id="shiftFilter" onchange="changeShift(this.value)"></select><b>Ronda:</b><select id="roundFilter" onchange="selectRound(this.value)"></select></div>
  <div class="tablewrap"><div class="table"><div class="thead"><div>EMPLEADO</div><div>ESTADO</div><div>TAREA</div><div>OBSERVACIONES</div><div>HISTORIAL</div></div><div id="rows"></div></div></div>
 </section>
</main>
</section>

<div class="modal-bg" id="attendanceModal"><div class="modal">
<button class="close" onclick="closeAttendance()">×</button><h2>Cargar Asistencia</h2><div class="att-sub" id="attSub"></div>
<div class="att-add">
  <input id="newEmployee" placeholder="Nombre del nuevo empleado..." onkeydown="if(event.key==='Enter')addEmployee()">
  <select id="employeeRole" class="field" style="width:150px;height:38px">
    <option value="Chofer">Chofer</option>
    <option value="Limpieza">Limpieza</option>
    <option value="Operario" selected>Operario</option>
  </select>
  <button class="load" onclick="addEmployee()">Agregar</button>
</div>
<div id="attList"></div>
<div class="controller"><b>Controlador:</b><input id="controllerName" readonly></div>
<div class="foot"><span id="attCount"></span><button class="primary" onclick="saveAttendance()">Listo</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://fgmbknekocrtycptrcpy.supabase.co";
const SUPABASE_KEY="sb_publishable_MyrXVvJ4lPWR-cwTQCdsOA_JWBnoQEC";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,shifts=[],rounds=[],employees=[],tasks=[],state={date:new Date().toISOString().slice(0,10),shiftId:null,roundId:null},draft=[];

async function login(){
 const name=document.getElementById("regName").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||password.length<6||!name){msg("Completá nombre, correo y contraseña.");return}
 let r=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
 if(r.error && !r.error.message.toLowerCase().includes("already")){msg(r.error.message);return}
 let s=await sb.auth.signInWithPassword({email,password});
 if(s.error){msg(s.error.message);return}
 user=s.data.user;await loadProfile(name);await start();
}
async function loadProfile(name){
 let r=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(!r.data){await sb.from("profiles").insert({id:user.id,full_name:name})}
 r=await sb.from("profiles").select("*").eq("id",user.id).single();profile=r.data;
}
async function start(){document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");document.getElementById("userBadge").textContent=profile.full_name;document.getElementById("date").value=state.date;await loadData()}
async function loadData(){
 let a=await sb.from("shifts").select("*").eq("active",true).order("sort_order");if(a.error)return fail(a.error);shifts=a.data;
 let b=await sb.from("rounds").select("*").eq("active",true).order("sort_order");rounds=b.data;
 let c=await sb.from("employees").select("*").eq("active",true).order("full_name");employees=c.data;
 let d=await sb.from("tasks").select("*").eq("active",true).order("name");tasks=d.data;
 if(!state.shiftId)state.shiftId=shifts[0]?.id;
 const rs=rounds.filter(x=>x.shift_id===state.shiftId);if(!state.roundId||!rs.some(x=>x.id===state.roundId))state.roundId=rs[0]?.id;
 renderSelectors();await render();
}
function renderSelectors(){
 const opts=shifts.map(s=>`<option value="${s.id}" ${s.id===state.shiftId?"selected":""}>${esc(s.name)}</option>`).join("");
 shiftTop.innerHTML=opts;shiftFilter.innerHTML=opts;
 const rs=rounds.filter(r=>r.shift_id===state.shiftId);
 roundFilter.innerHTML=rs.map(r=>`<option value="${r.id}" ${r.id===state.roundId?"selected":""}>${r.time.slice(0,5)}</option>`).join("");
 const s=shifts.find(x=>x.id===state.shiftId);shiftName.textContent=s?.name||"";shiftTimes.textContent="◷ "+rs.map(r=>r.time.slice(0,5)).join(" • ");
 title.textContent=`Ronda ${rounds.find(r=>r.id===state.roundId)?.time.slice(0,5)||""} · ${s?.name||""}`;
 const idx=rs.findIndex(r=>r.id===state.roundId);nextInfo.textContent=idx>=0&&rs[idx+1]?`Próxima ronda ${rs[idx+1].time.slice(0,5)}`:"";
}
async function render(){
 renderRounds();
 let {data:att,error}=await sb.from("attendance").select("*,task_id").eq("control_date",state.date).eq("shift_id",state.shiftId).eq("round_id",state.roundId);
 if(error)return fail(error);
 const map=new Map((att||[]).map(x=>[x.employee_id,x]));
 rows.innerHTML=employees.map(e=>{
  const x=map.get(e.id)||{present:false,task_id:null,observation:""};
  return `<div class="row"><div class="employee"><div class="avatar">${initials(e.full_name)}</div><div>${esc(e.full_name)}<small>${esc(e.role)}</small></div></div>
  <div class="toggle"><button class="${x.present?'on':''}" onclick="setPresence('${e.id}',true)">ACTIVO</button><button class="${!x.present?'off':''}" onclick="setPresence('${e.id}',false)">INACTIVO</button></div>
  <select class="field" onchange="saveField('${e.id}','task_id',this.value)"><option value="">Seleccionar tarea...</option>${tasks.map(t=>`<option value="${t.id}" ${x.task_id===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
  <input class="field obs" value="${esc(x.observation||"")}" placeholder="Observaciones..." onchange="saveField('${e.id}','observation',this.value)">
  <div class="history">${rounds.filter(r=>r.shift_id===state.shiftId).map(r=>`<span class="${r.id===state.roundId?'cur':''}">${r.time.slice(0,5)}</span>`).join("")}${x.present||map.has(e.id)?`<button class="remove-att" onclick="removeAttendance('${e.id}')">Quitar</button>`:""}</div></div>`
 }).join("");
 const active=(att||[]).filter(x=>x.present).length;act.textContent=active;ina.textContent=employees.length-active;
}
function renderRounds(){roundsBox.innerHTML=""}
function renderRounds(){document.getElementById("rounds").innerHTML=rounds.filter(r=>r.shift_id===state.shiftId).map((r,i)=>`<div class="round ${r.id===state.roundId?'sel':''}" onclick="selectRound('${r.id}')"><div class="num">${i+1}</div><div><b>${r.time.slice(0,5)}</b></div></div>`).join("")}
async function setPresence(id,present){await upsert(id,{present})}
async function saveField(id,key,value){await upsert(id,{[key]:value||null})}
async function upsert(employeeId,changes){
 const payload={control_date:state.date,shift_id:state.shiftId,round_id:state.roundId,employee_id:employeeId,controller_id:user.id,controller_name:profile.full_name,...changes};
 const r=await sb.from("attendance").upsert(payload,{onConflict:"control_date,shift_id,round_id,employee_id"});if(r.error)return fail(r.error);await render();toast("Guardado")}
async function openAttendance(){
 const r=await sb.from("attendance").select("*").eq("control_date",state.date).eq("shift_id",state.shiftId).eq("round_id",state.roundId);
 const map=new Map((r.data||[]).map(x=>[x.employee_id,x]));draft=employees.map(e=>({id:e.id,present:map.get(e.id)?.present||false}));
 attSub.textContent=`${formatDate(state.date)} · ${shifts.find(s=>s.id===state.shiftId)?.name} · Ronda ${rounds.find(r=>r.id===state.roundId)?.time.slice(0,5)}`;
 controllerName.value=profile.full_name;renderDraft();attendanceModal.style.display="flex";
}
function renderDraft(){attList.innerHTML=draft.map(d=>{let e=employees.find(x=>x.id===d.id);return `<div class="att-row"><div><b>${esc(e.full_name)}</b><span class="att-role">${esc(e.role||e.position||"")}</span></div><input type="checkbox" ${d.present?'checked':''} onchange="draft.find(x=>x.id==='${d.id}').present=this.checked"><button class="trash" onclick="removeFromAttendance('${d.id}')">🗑</button></div>`}).join("");attCount.textContent=`${draft.filter(x=>x.present).length} de ${draft.length} asistiendo`}
async function addEmployee(){let name=newEmployee.value.trim(),role=employeeRole.value;if(!name)return;let r=await sb.from("employees").insert({full_name:name,role:role,position:role}).select().single();if(r.error)return fail(r.error);employees.push(r.data);draft.push({id:r.data.id,present:true});newEmployee.value="";employeeRole.value="Operario";renderDraft();await render()}
async function removeFromAttendance(id){if(!confirm("¿Querés quitar esta asistencia?"))return;let r=await sb.from("attendance").delete().eq("control_date",state.date).eq("shift_id",state.shiftId).eq("round_id",state.roundId).eq("employee_id",id);if(r.error)return fail(r.error);draft=draft.filter(x=>x.id!==id);renderDraft();await render();toast("Asistencia quitada")}
async function removeEmployee(id){await sb.from("employees").update({active:false}).eq("id",id);employees=employees.filter(e=>e.id!==id);draft=draft.filter(e=>e.id!==id);renderDraft();render()}
async function saveAttendance(){for(const d of draft)await upsert(d.id,{present:d.present});closeAttendance();toast("Asistencia guardada")}
function closeAttendance(){attendanceModal.style.display="none"}
async function changeShift(id){state.shiftId=id;const rs=rounds.filter(r=>r.shift_id===id);state.roundId=rs[0]?.id;renderSelectors();await render();if(rs[0])openAttendance()}
async function selectRound(id){state.roundId=id;renderSelectors();await render()}
function changeDate(v){state.date=v;render()}
async function logout(){await sb.auth.signOut();location.reload()}
function notify(){toast("Notificación de ronda disparada")}
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function msg(x){loginMsg.textContent=x}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function initials(n){return n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function formatDate(v){return new Intl.DateTimeFormat("es-UY",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(v+"T12:00:00"))}
function fail(e){console.error(e);toast(e.message||"Error de base de datos")}
(async()=>{let s=await sb.auth.getSession();if(s.data.session){user=s.data.session.user;await loadProfile(user.user_metadata?.full_name||"Controlador");await start()}})();
</script>
</body>
</html>
